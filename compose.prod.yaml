# ============================================================
# HA'WE 운영(EC2)용 Compose: api + vision 만 띄운다
#   DB    → RDS (EC2 의 .env 에 있는 DB_URL)
#   사진  → S3  (.env 의 STORAGE_TYPE=s3, EC2 IAM Role 로 권한)
# EC2 의 ~/hawe 폴더에 이 파일, .env, models/ 를 두고 실행한다.
#   켜기: docker compose -f compose.prod.yaml up -d
#   끄기: docker compose -f compose.prod.yaml down
# EC2 에서는 이미지를 빌드하지 않는다(메모리 2GB 부족) → GHCR 에서 docker compose pull 로 받는다.
# ============================================================
name: hawe

# [로그 제한] 컨테이너 로그는 그대로 두면 디스크가 찰 때까지 쌓인다.
# 10MB 파일을 최대 3개까지만 남긴다. 아래 두 서비스에서 같이 쓰려고 이름(&logging)을 붙였다.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:

  vision:
    # build: 가 없다 → 이 이름의 이미지가 EC2 에 이미 있어야 한다(docker compose pull 로 받는다)
    image: hawe-vision:latest
    volumes:
      # EC2 의 ~/hawe/models 를 읽기 전용으로 연결한다(git 에 없는 ONNX 파일).
      - ./models:/models:ro
    # ports 없음 → 인터넷에서 접근 불가, api 만 내부에서 부른다.
    # t3.small(2GB) 을 나눠 쓴다: vision 1GB + api 800MB, 나머지는 OS·Docker 몫.
    # vision 은 모델 2개만 올려도 550~720MB 를 써서 750MB 로는 사진 판정 중에 한도를 넘을 수 있다(2026-11-10 측정).
    mem_limit: 1g
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/healthz')"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    # 죽거나 EC2 가 재부팅돼도 자동으로 다시 켠다(예전 nohup 방식은 재부팅하면 꺼졌다).
    restart: unless-stopped
    logging: *logging

  api:
    image: ghcr.io/maenghansoo1/hawe-api:${TAG:-latest}
    # EC2 의 ~/hawe/.env : RDS 주소(DB_URL), STORAGE_TYPE=s3, S3_BUCKET, JWT_SECRET, LLM_* ...
    env_file: .env
    environment:
      # 로컬과 달리 DB_URL·STORAGE_TYPE 은 .env 값을 그대로 쓴다. vision 연결만 지정한다.
      HAWE_VISION_ENABLED: "true"
      HAWE_VISION_BASE_URL: http://vision:8001
    ports:
      # 보안 그룹에서 이미 열려 있는 8080. 앱이 접속하는 유일한 입구.
      - "8080:8080"
    # 컨테이너 메모리 800MB → Dockerfile 의 MaxRAMPercentage=70 으로 Java 힙은 약 560MB.
    # 실제 사용은 약 250~270MB(2026-11-10 측정)라 여유가 있다.
    mem_limit: 800m
    depends_on:
      vision:
        condition: service_healthy
    restart: unless-stopped
    logging: *logging
