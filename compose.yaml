# ============================================================
# HA'WE 로컬 개발용 Compose: db + vision + api 를 한 번에 띄운다
#   켜기:  docker compose up --build   (C:\Sapphire 에서)
#   끄기:  docker compose down         (DB·사진은 볼륨에 남는다)
#   초기화: docker compose down -v     (볼륨까지 지움 = DB 새로 시작)
# ${DB_PASSWORD} 같은 값은 같은 폴더의 .env 에서 자동으로 읽는다.
# ============================================================

# 프로젝트 이름. 컨테이너 이름이 hawe-api-1, hawe-db-1 처럼 붙는다.
name: hawe

services:

  # ---------------- 1) DB: MariaDB 컨테이너 ----------------
  db:
    # 직접 만들지 않고 Docker Hub의 공식 이미지를 받아 쓴다.
    image: mariadb:11.4
    environment:
      # 이 값들로 MariaDB가 처음 켜질 때 DB와 계정을 자동으로 만든다.
      # (2-4에서 HeidiSQL로 하던 CREATE USER·GRANT를 대신한다. 계정은 '%'로 만들어진다)
      MARIADB_DATABASE: hawe
      MARIADB_USER: ${DB_USERNAME:-hawe_db}
      # :? → .env 에 값이 없으면 실행을 멈추고 이 메시지를 보여준다.
      MARIADB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD 를 .env 에 넣어 주세요}
      # root 비밀번호는 쓸 일이 없어 무작위로 만든다.
      MARIADB_RANDOM_ROOT_PASSWORD: "1"
      TZ: Asia/Seoul
    # 한글·이모지(댓글의 이모지 등)가 깨지지 않게 utf8mb4 로 띄운다.
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    volumes:
      # [이름 붙은 볼륨] DB 파일을 컨테이너 밖(Docker가 관리하는 저장소)에 둔다.
      # → 컨테이너를 지웠다 다시 만들어도 데이터가 남는다.
      - db-data:/var/lib/mysql
    ports:
      # HeidiSQL로 들여다볼 때 localhost:3307 로 접속한다.
      # PC의 MariaDB가 이미 3306을 쓰고 있어서 겹치지 않게 3307로 연결한다.
      - "3307:3306"
    healthcheck:
      # [헬스체크] DB가 '켜졌다'가 아니라 '접속 가능하다'를 확인하는 명령.
      # depends_on 에서 이 결과를 보고 api 를 늦게 띄운다.
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30

  # ---------------- 2) vision: 1단계에서 만든 사진 판정 서비스 ----------------
  vision:
    # build: 이 폴더의 Dockerfile 로 이미지를 만든다(1-3의 docker build 와 같다).
    build: ml/vision-service
    # 만든 이미지에 붙일 이름(1단계와 같은 이름).
    image: ghcr.io/maenghansoo1/hawe-vision:${TAG:-latest}
    volumes:
      # 1-4의 -v 옵션과 같다. 모델 폴더를 읽기 전용(ro)으로 연결한다.
      - ./ml/vision-service/models:/models:ro
    # ports 가 없다 → PC에서는 접속할 수 없고, 같은 Compose 안의 api 만 부를 수 있다.
    # 메모리 상한. 넘으면 이 컨테이너만 재시작되고 다른 컨테이너는 영향이 없다.
    mem_limit: 1g
    healthcheck:
      # 이미지에 curl 이 없어서 python 으로 /healthz 를 호출해 본다.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/healthz')"]
      interval: 10s
      timeout: 5s
      retries: 12
      # 모델을 읽는 동안(몇 초)은 실패해도 세지 않는다.
      start_period: 20s
    # 컨테이너가 죽으면 자동으로 다시 켠다(직접 down 한 경우는 제외).
    restart: unless-stopped

  # ---------------- 3) api: 2단계에서 만든 Spring 서버 ----------------
  api:
    build: .
    image: ghcr.io/maenghansoo1/hawe-api:${TAG:-latest}
    # 2-5의 --env-file .env 와 같다. JWT_SECRET, LLM_* 등 비밀값을 실행할 때 넣는다.
    env_file: .env
    environment:
      # env_file(.env)보다 우선한다. 2-5의 -e 옵션과 같은 역할.
      # [서비스 이름으로 접속] 같은 Compose 안에서는 서비스 이름이 곧 주소다.
      #   db:3306      → 위의 db 컨테이너 (2-5에서는 host.docker.internal 이었다)
      #   vision:8001  → 위의 vision 컨테이너
      DB_URL: "jdbc:mariadb://db:3306/hawe?sessionVariables=time_zone='+09:00'"
      HAWE_VISION_ENABLED: "true"
      HAWE_VISION_BASE_URL: http://vision:8001
      # 로컬에서는 사진을 S3 가 아니라 컨테이너 안 폴더에 저장한다.
      STORAGE_TYPE: local
    ports:
      # 앱·브라우저가 접속하는 유일한 입구.
      - "8080:8080"
    volumes:
      # 업로드한 사진도 볼륨에 둬서 컨테이너를 지워도 남게 한다.
      - uploads:/app/uploads
    mem_limit: 1g
    depends_on:
      # [시작 순서] db 와 vision 의 헬스체크가 통과한 뒤에 api 를 켠다.
      # → 시작하자마자 Flyway가 DB에 못 붙어 실패하는 일을 막는다.
      db:
        condition: service_healthy
      vision:
        condition: service_healthy
    restart: unless-stopped

# 위에서 쓴 이름 붙은 볼륨 목록. Docker가 만들고 관리한다(Docker Desktop의 Volumes 메뉴에 보인다).
volumes:
  db-data:
  uploads:
