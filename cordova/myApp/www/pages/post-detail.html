<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="initial-scale=1, width=device-width, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' data: gap: https://ssl.gstatic.com https://fonts.googleapis.com https://fonts.gstatic.com 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com;">
<title>게시물 상세</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Gowun+Dodum&display=swap">
<link rel="stylesheet" href="../css/base.css">
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F3EAD8; display: flex; flex-direction: column; color: #3E2F22; overflow: hidden; position: relative;">
  <div style="padding: 18px 20px 6px 20px; display: flex; align-items: center; gap: 12px;">
    <a href="group-feed.html" style="font-size: 18px;">←</a>
    <div style="font-size: 15px; font-weight: 700;">게시물</div>
  </div>
  <div style="padding: 0 20px 8px 20px; display: flex; align-items: center; gap: 8px;">
    <div style="width: 24px; height: 24px; border-radius: 50%; background: #E8C4A0;"></div>
    <div style="font-size: 12px; font-weight: 700;">엄마</div>
  </div>
  <div style="margin: 0 20px; background: #FBF5E9; border: 1px solid #DCCBAA; padding: 8px 8px 10px 8px; box-shadow: 0 3px 6px rgba(90,76,58,0.15);">
    <div style="height: 150px; background: #E9DFC9;"></div>
    <div style="padding: 8px 4px 0 4px; font-family: 'Gowun Batang', serif; font-size: 13px; color: #5A4C3A;">"오늘도 무사히" — 잔잔한 다큐멘터리</div>
  </div>

  <div style="padding: 8px 20px 0 20px; display: flex; flex-direction: column; gap: 5px;">
    <div style="font-size: 10px; color: #8B7B63;">앱 전용 스티커로 반응하기</div>
    <div style="display: flex; gap: 8px;">
      <div style="width: 26px; height: 26px; border-radius: 50%; background: #F0C85A; position: relative; flex-shrink: 0;">
        <div style="position: absolute; top: 9px; left: 6px; width: 3px; height: 3px; background: #5A4C3A; border-radius: 50%;"></div>
        <div style="position: absolute; top: 9px; right: 6px; width: 3px; height: 3px; background: #5A4C3A; border-radius: 50%;"></div>
        <div style="position: absolute; bottom: 6px; left: 8px; width: 10px; height: 2px; background: #5A4C3A; border-radius: 1px;"></div>
      </div>
      <div style="width: 26px; height: 26px; border-radius: 50%; background: #E8956B; position: relative; flex-shrink: 0;">
        <div style="position: absolute; top: 7px; left: 6px; width: 3px; height: 3px; background: #5A2E1A; border-radius: 50%;"></div>
        <div style="position: absolute; top: 7px; right: 6px; width: 3px; height: 3px; background: #5A2E1A; border-radius: 50%;"></div>
        <div style="position: absolute; bottom: 4px; left: 8px; width: 10px; height: 6px; background: #5A2E1A; border-radius: 0 0 5px 5px;"></div>
      </div>
      <div style="width: 26px; height: 26px; border-radius: 50%; background: #9FB3C7; position: relative; flex-shrink: 0;">
        <div style="position: absolute; top: 10px; left: 5px; width: 4px; height: 3px; border-bottom: 1.5px solid #33475E; border-radius: 0 0 3px 3px;"></div>
        <div style="position: absolute; top: 10px; right: 5px; width: 4px; height: 3px; border-bottom: 1.5px solid #33475E; border-radius: 0 0 3px 3px;"></div>
        <div style="position: absolute; bottom: 6px; left: 8px; width: 10px; height: 3px; border-top: 1.5px solid #33475E; border-radius: 3px 3px 0 0;"></div>
      </div>
    </div>
  </div>

  <div style="flex-grow: 1; padding: 12px 20px 0 20px; display: flex; flex-direction: column; gap: 8px; overflow-y: auto; border-top: 1px solid #E3D6BB; margin-top: 8px;">
    <div style="background: #FDF7ED; border: 1px solid #E3D6BB; border-radius: 2px; padding: 8px 10px; transform: rotate(-0.8deg); margin-top: 8px;">
      <div style="font-size: 10px; font-weight: 700; color: #C1694A; margin-bottom: 2px;">막내</div>
      <div style="font-size: 12px; color: #5A4C3A;"><span style="color: #C1694A; font-weight: 700;">@아빠</span> 이거 완전 아빠 다큐랑 세트로 붙여야 함</div>
      <div style="width: 60px; height: 44px; background: #E9DFC9; border-radius: 2px; margin-top: 6px;"></div>
    </div>
    <div style="background: #FDF7ED; border: 1px solid #E3D6BB; border-radius: 2px; padding: 8px 10px; transform: rotate(0.8deg);">
      <div style="font-size: 10px; font-weight: 700; color: #C1694A; margin-bottom: 2px;">아빠</div>
      <div style="font-size: 12px; color: #5A4C3A;">오늘도 고생했어</div>
    </div>
  </div>

  <div style="padding: 10px 20px 20px 20px; display: flex; gap: 6px; border-top: 1px solid #E3D6BB; align-items: center;">
    <div style="width: 34px; height: 34px; border-radius: 50%; background: #FBF5E9; border: 1px solid #DCCBAA; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
      <div style="width: 14px; height: 14px; border: 1.4px solid #A79878; border-radius: 2px;"></div>
    </div>
    <div style="flex-grow: 1; background: #FBF5E9; border: 1px solid #DCCBAA; border-radius: 20px; padding: 9px 14px; font-size: 12px; color: #A79878;">@태그, 사진 첨부해서 댓글 달기...</div>
    <div style="background: #C1694A; color: #FBF0E4; border-radius: 20px; padding: 9px 14px; font-size: 12px; font-weight: 700; flex-shrink: 0;">등록</div>
  </div>
</div>
<script src="cordova.js"></script>
<script src="../js/app.js"></script>
</body>
</html>
