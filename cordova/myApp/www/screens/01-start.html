<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="initial-scale=1, width=device-width, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' data: gap: https://ssl.gstatic.com https://fonts.googleapis.com https://fonts.gstatic.com 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com;">
<title>시작</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Fredoka:wght@600&display=swap">
<link rel="stylesheet" href="../css/hawe.css">
<style>
  .screen { position: relative; gap: 48px; padding: 96px 24px 36px; }
  .mypage { position: absolute; top: 58px; right: 14px; display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; }
  .intro { display: flex; flex-direction: column; gap: 12px; }
  .intro h1 { font-size: 30px; font-weight: 700; line-height: 1.3; }
  .intro p { font-size: 15px; line-height: 1.6; color: var(--color-text-secondary); }
  .types { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .type { display: flex; flex-direction: column; gap: 28px; padding: 20px; border-radius: 20px; background: var(--color-surface); font-size: 16px; font-weight: 600; }
  .actions { display: flex; flex-direction: column; gap: 12px; }
</style>
</head>
<body>
<main class="screen">
  <a class="mypage" href="17-mypage.html" aria-label="마이페이지"><span class="ic s-22"><img src="../img/ui/icons/person.svg" alt=""></span></a>

  <section class="intro">
    <div class="lockup">
      <span class="ic s-30"><img src="../img/ui/logo/symbol-small-accent.svg" alt=""></span>
      <span class="wordmark">HA<span class="apos">'</span>WE</span>
    </div>
    <h1>매일 하나의 미션,<br>우리만의 기록</h1>
    <p>오늘은 그림일까, 사진일까?<br>매일 랜덤으로 정해지는 미션을 최대 6명이 함께해요.</p>
  </section>

  <section class="types">
    <div class="type"><span class="ic s-26"><img src="../img/ui/icons/pencil.svg" alt=""></span>그림</div>
    <div class="type"><span class="ic s-26"><img src="../img/ui/icons/camera.svg" alt=""></span>사진</div>
    <div class="type"><span class="ic s-26"><img src="../img/ui/icons/text.svg" alt=""></span>글</div>
    <div class="type"><span class="ic s-26"><img src="../img/ui/icons/mic.svg" alt=""></span>음성</div>
  </section>

  <div class="spacer"></div>
  <div class="actions">
    <a class="btn btn-primary" href="02-group-create.html">새 그룹 만들기</a>
    <a class="btn btn-secondary" href="03-join.html">초대 코드로 참여하기</a>
  </div>
</main>
<script src="../cordova.js"></script>
<script src="../js/app.js"></script>
<script src="../js/hawe.js"></script>

</html>
