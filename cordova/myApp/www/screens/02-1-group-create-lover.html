<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="initial-scale=1, width=device-width, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' data: gap: https://ssl.gstatic.com https://fonts.googleapis.com https://fonts.gstatic.com 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com;">
<title>그룹 만들기 · 연인</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Fredoka:wght@600&display=swap">
<link rel="stylesheet" href="../css/hawe.css">
<style>
  .screen { padding-bottom: 40px; }
  .scroll { display: flex; flex-direction: column; gap: 20px; padding: 12px 0 20px; }
  .title { display: flex; flex-direction: column; gap: 8px; }
  .title h1 { font-size: 26px; font-weight: 700; }
  .title p { font-size: 15px; color: var(--color-text-secondary); }
  .field.name { gap: 10px; }
  .count { font-size: 13px; color: var(--color-text-secondary); text-align: right; }
  .relation { display: flex; flex-direction: column; gap: 12px; }
  .decor-preview { flex-direction: row; align-items: center; justify-content: space-between; padding: 14px 16px; border-radius: 16px; }
  .decor-preview .txt { display: flex; flex-direction: column; gap: 2px; white-space: nowrap; }
  .date { position: relative; justify-content: space-between; }
  .date-native { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; }
  .date-hint { font-size: 13px; line-height: 1.5; color: var(--color-text-secondary); }
  .max { flex-direction: row; align-items: center; justify-content: space-between; padding: 16px 18px; white-space: nowrap; }
  .max .txt { display: flex; flex-direction: column; gap: 2px; }
</style>
</head>
<body>
<main class="screen px-24 is-fixed">
  <header class="hdr">
    <a class="hdr-btn" href="01-start.html" data-back aria-label="뒤로"><span class="ic"><img src="../img/ui/icons/chevron-left.svg" alt=""></span></a>
    <div class="hdr-right"></div>
  </header>

  <form class="scroll" id="create" action="16-group-settings.html">
    <div class="title">
      <h1>새 그룹 만들기</h1>
      <p>만든 뒤 초대 코드로 연인 1명을 초대할 수 있어요.</p>
    </div>

    <label class="field name">
      <span class="field-label">그룹 이름</span>
      <input class="input" type="text" value="우리 둘" maxlength="16" data-count="#name-count">
      <span class="count" id="name-count">4 / 16</span>
    </label>

    <div class="relation">
      <span class="field-label">어떤 사이인가요?</span>
      <div class="chips">
        <span class="chip is-selected">연인</span>
        <a class="chip" href="02-group-create.html">친구</a>
        <a class="chip" href="02-group-create.html">가족</a>
        <a class="chip" href="02-group-create.html">웬수</a>
        <a class="chip" href="02-group-create.html">그저그런사이</a>
      </div>
      <div class="card decor-preview">
        <div class="txt">
          <span class="fw-6" style="font-size: 13px;">홈 화면에서 이렇게 보여요</span>
          <span class="c-2" style="font-size: 12px;">캐릭터 사이에 하트가 떠요</span>
        </div>
        <div class="members">
          <span class="avatar a-38"><span class="ic"><img src="../img/ui/chars/mongsil.svg" alt=""></span></span>
          <span class="decor" style="--d: 22px;"><span class="ic s-15"><img src="../img/ui/decor/lover-15.svg" alt=""></span></span>
          <span class="avatar a-38"><span class="ic"><img src="../img/ui/chars/bear.svg" alt=""></span></span>
        </div>
      </div>
    </div>

    <label class="field">
      <span class="field-label">우리의 1일</span>
      <span class="input date">
        <span id="date-text">2026년 6월 5일</span>
        <span class="ic s-20"><img src="../img/ui/icons/calendar-20.svg" alt=""></span>
        <input class="date-native" type="date" value="2026-06-05" id="date">
      </span>
      <span class="date-hint">이 날부터 함께한 날을 세고, 100일·1주년 같은 기념일엔 특별한 주제가 와요.</span>
    </label>

    <div class="soft max">
      <div class="txt">
        <span class="fw-6" style="font-size: 15px;">최대 인원</span>
        <span class="c-2" style="font-size: 13px;">연인 그룹은 둘만 함께해요</span>
      </div>
      <span class="fw-7" style="font-size: 17px;">2명</span>
    </div>
  </form>

  <button class="btn btn-primary" type="submit" form="create">그룹 만들고 초대 코드 받기</button>
</main>
<script src="../cordova.js"></script>
<script src="../js/app.js"></script>
<script src="../js/hawe.js"></script>
<script>
  document.getElementById('date').addEventListener('change', function () {
    var d = this.value.split('-');
    if (d.length === 3) document.getElementById('date-text').textContent = d[0] + '년 ' + Number(d[1]) + '월 ' + Number(d[2]) + '일';
  });
</script>
</body>
</html>
