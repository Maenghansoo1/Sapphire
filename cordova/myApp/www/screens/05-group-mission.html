<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="initial-scale=1, width=device-width, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' data: gap: https://ssl.gstatic.com https://fonts.googleapis.com https://fonts.gstatic.com 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com;">
<title>오늘의 미션</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Fredoka:wght@600&display=swap">
<link rel="stylesheet" href="../css/hawe.css">
<style>
  .mission { gap: 18px; padding: 22px; border-radius: 24px; }
  .mission-top { display: flex; align-items: center; justify-content: space-between; white-space: nowrap; }
  .type { display: flex; align-items: center; gap: 8px; height: 32px; padding: 0 12px; border-radius: 16px; background: var(--color-surface); font-size: 13px; font-weight: 600; }
  .mission h1 { font-size: 24px; font-weight: 700; line-height: 1.35; }
  .section-hd { padding: 28px 0 4px; }
  .member { display: flex; align-items: center; gap: 12px; height: 56px; border-bottom: 1px solid var(--color-line); }
  .member-name { flex: 1 0 0; min-width: 0; font-size: 15px; font-weight: 500; }
  .done { display: flex; align-items: center; gap: 4px; font-size: 13px; font-weight: 600; }
  .lock { display: flex; align-items: center; gap: 14px; margin-top: 20px; padding: 18px; border-radius: 18px; background: var(--color-surface); font-size: 14px; color: var(--color-text-strong); }
</style>
</head>
<body>
<main class="screen">
  <header class="hdr">
    <a class="hdr-btn" href="04-home.html" data-back aria-label="뒤로"><span class="ic"><img src="../img/ui/icons/chevron-left.svg" alt=""></span></a>
    <span class="hdr-title">컴공 동기</span>
    <div class="hdr-right">
      <a href="15-calendar.html" aria-label="기록 캘린더"><span class="ic s-22"><img src="../img/ui/icons/calendar.svg" alt=""></span></a>
      <a href="16-group-settings.html" aria-label="그룹 정보"><span class="ic s-22"><img src="../img/ui/icons/more.svg" alt=""></span></a>
    </div>
  </header>

  <section class="card mission">
    <div class="mission-top">
      <span class="type"><span class="ic s-16"><img src="../img/ui/icons/camera.svg" alt=""></span>오늘은 사진</span>
      <span class="c-2" style="font-size: 13px;">10월 11일 · #142</span>
    </div>
    <h1>지금 창밖으로<br>보이는 풍경</h1>
    <p class="c-2" style="font-size: 13px;">다음 미션까지 <span id="countdown">06:12:40</span></p>
    <a class="btn btn-primary" href="07-mission-photo.html">사진 찍기</a>
  </section>

  <div class="section-hd"><span>참여 현황</span><span>3 / 5명 완료</span></div>
  <section>
    <div class="member">
      <span class="avatar a-38"><span class="ic"><img src="../img/ui/chars/bear.svg" alt=""></span></span>
      <span class="member-name">과대표 하늘 (나)</span>
      <span class="c-2 nowrap" style="font-size: 13px;">아직 안 했어요</span>
    </div>
    <div class="member">
      <span class="avatar a-38"><span class="ic"><img src="../img/ui/chars/potato.svg" alt=""></span></span>
      <span class="member-name">민준</span>
      <span class="done"><span class="ic s-16"><img src="../img/ui/icons/check.svg" alt=""></span>완료</span>
    </div>
    <div class="member">
      <span class="avatar a-38"><span class="ic"><img src="../img/ui/chars/flower.svg" alt=""></span></span>
      <span class="member-name">지우</span>
      <span class="done"><span class="ic s-16"><img src="../img/ui/icons/check.svg" alt=""></span>완료</span>
    </div>
    <div class="member">
      <span class="avatar a-38"><span class="ic"><img src="../img/ui/chars/drop.svg" alt=""></span></span>
      <span class="member-name">서연</span>
      <span class="done"><span class="ic s-16"><img src="../img/ui/icons/check.svg" alt=""></span>완료</span>
    </div>
    <div class="member">
      <span class="avatar a-38"><span class="ic"><img src="../img/ui/chars/film.svg" alt=""></span></span>
      <span class="member-name">현우</span>
      <button class="pill" type="button">콕 찌르기</button>
    </div>
  </section>

  <div class="lock">
    <span class="ic s-22"><img src="../img/ui/icons/lock-secondary.svg" alt=""></span>
    내 미션을 올리면 친구들의 사진이 열려요.
  </div>
</main>
<script src="../cordova.js"></script>
<script src="../js/app.js"></script>
<script src="../js/hawe.js"></script>
</body>
</html>
