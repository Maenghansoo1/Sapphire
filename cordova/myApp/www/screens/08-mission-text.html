<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="initial-scale=1, width=device-width, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' data: gap: https://ssl.gstatic.com https://fonts.googleapis.com https://fonts.gstatic.com 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com;">
<title>미션 수행 · 글</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Fredoka:wght@600&display=swap">
<link rel="stylesheet" href="../css/hawe.css">
<style>
  .screen { gap: 16px; }
  .mission-title { display: flex; flex-direction: column; gap: 4px; padding-top: 4px; }
  textarea {
    display: block; width: 100%; height: 360px; padding: 20px; resize: none; outline: none;
    border: 1px solid var(--color-line); border-radius: 20px;
    font-size: 17px; line-height: 1.7;
  }
  textarea::placeholder { color: var(--color-text-tertiary); }
  textarea:focus { border-color: var(--color-border); }
</style>
</head>
<body>
<main class="screen">
  <header class="hdr">
    <a class="hdr-btn" href="05-group-mission.html" data-back aria-label="닫기"><span class="ic s-22"><img src="../img/ui/icons/close.svg" alt=""></span></a>
    <div class="hdr-right c-2" style="font-size: 13px;" id="count">0 / 300</div>
  </header>

  <div class="mission-title">
    <span class="fw-6 c-2" style="font-size: 13px;">오늘의 글</span>
    <span class="fw-7" style="font-size: 20px;">너에게 해주고 싶은 말 한 줄</span>
  </div>

  <textarea placeholder="여기에 적어보세요" maxlength="300" data-count="#count"></textarea>
  <p class="c-2" style="font-size: 13px;">모두가 올리기 전까지 아무도 볼 수 없어요.</p>

  <div class="spacer"></div>
  <a class="btn btn-primary" href="12-result-text.html">올리기</a>
</main>
<script src="../cordova.js"></script>
<script src="../js/app.js"></script>
<script src="../js/hawe.js"></script>
</body>
</html>
