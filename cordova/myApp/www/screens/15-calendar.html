<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="initial-scale=1, width=device-width, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' data: gap: https://ssl.gstatic.com https://fonts.googleapis.com https://fonts.gstatic.com 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com;">
<title>기록 캘린더</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Fredoka:wght@600&display=swap">
<link rel="stylesheet" href="../css/hawe.css">
<style>
  .month { display: flex; align-items: center; justify-content: space-between; padding-top: 12px; font-size: 18px; font-weight: 700; }
  .month button { display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; }
  .cal { display: grid; grid-template-columns: repeat(7, 1fr); row-gap: 4px; padding-top: 12px; }
  .wd { display: flex; align-items: center; justify-content: center; height: 28px; font-size: 12px; font-weight: 600; color: var(--color-text-secondary); }
  .day {
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
    height: 52px; border: 1.5px solid transparent; border-radius: 14px;
    font-size: 15px; font-weight: 500; color: var(--color-ink);
  }
  .day small { font-size: 10px; font-weight: 600; line-height: normal; color: var(--color-text-secondary); }
  .day small:empty::before { content: '\00a0'; }
  .day.has-post { font-weight: 700; cursor: pointer; }
  .day.is-today { border-color: var(--color-ink); }
  .day.is-future { color: #b0b0b5; }
  .day.is-selected { background: var(--color-ink); color: var(--color-on-accent); }
  .day.is-selected small { color: inherit; }
  .legend { display: flex; gap: 14px; padding-top: 12px; font-size: 12px; color: var(--color-text-secondary); white-space: nowrap; }
  .selected { gap: 10px; margin-top: 20px; padding: 18px; }
  .selected-ft { display: flex; align-items: center; justify-content: space-between; }
</style>
</head>
<body>
<main class="screen">
  <header class="hdr">
    <a class="hdr-btn" href="05-group-mission.html" data-back aria-label="뒤로"><span class="ic"><img src="../img/ui/icons/chevron-left.svg" alt=""></span></a>
    <span class="hdr-title">우리의 기록</span>
    <div class="hdr-right"></div>
  </header>

  <div class="month">
    <button type="button" aria-label="이전 달"><span class="ic s-20"><img src="../img/ui/icons/chevron-left.svg" alt=""></span></button>
    <span>2026년 10월</span>
    <button type="button" aria-label="다음 달"><span class="ic s-20"><img src="../img/ui/icons/chevron-right.svg" alt=""></span></button>
  </div>

  <div class="cal" id="cal" data-select>
    <span class="wd">일</span><span class="wd">월</span><span class="wd">화</span><span class="wd">수</span><span class="wd">목</span><span class="wd">금</span><span class="wd">토</span>
  </div>

  <div class="legend"><span>그 그림</span><span>사 사진</span><span>글 글</span><span>음 음성</span></div>

  <section class="card selected">
    <p class="c-2" style="font-size: 13px;" id="sel-date">10월 9일 · 글</p>
    <p class="fw-7" style="font-size: 17px;" id="sel-topic">오늘 들은 가장 따뜻한 말</p>
    <div class="selected-ft">
      <span class="c-2" style="font-size: 13px;" id="sel-count">5 / 5명 참여</span>
      <a class="pill h-36 is-soft" href="12-result-text.html" id="sel-link">모아보기</a>
    </div>
  </section>
</main>
<script src="../cordova.js"></script>
<script src="../js/app.js"></script>
<script src="../js/hawe.js"></script>
<script>
  (function () {
    // 목업 데이터: 2026년 10월, 오늘은 11일. 날짜별 미션 유형·주제
    var TYPES = { '그': ['그림', '11-result-drawing.html'], '사': ['사진', '10-result-photo.html'], '글': ['글', '12-result-text.html'], '음': ['음성', '13-result-voice.html'] };
    var posts = {
      1: ['그', '오늘 먹은 것 중 제일 맛있었던 것'], 2: ['사', '내 책상 위 풍경'], 3: ['글', '요즘 빠져 있는 것'],
      4: ['음', '좋아하는 노래 한 소절'], 5: ['그', '어릴 적 내 방'], 7: ['사', '오늘의 하늘'],
      8: ['음', '오늘 하루를 10초로 말해줘'], 9: ['글', '오늘 들은 가장 따뜻한 말'], 10: ['그', '요즘 제일 웃겼던 순간']
    };
    var firstWeekday = 4, days = 31, today = 11, selected = 9;
    var cal = document.getElementById('cal');

    for (var i = 0; i < firstWeekday; i++) cal.appendChild(document.createElement('span'));
    for (var d = 1; d <= days; d++) {
      var el = document.createElement('div'), post = posts[d];
      el.className = 'day' + (post ? ' has-post' : '') + (d === today ? ' is-today' : '') + (d > today ? ' is-future' : '') + (d === selected ? ' is-selected' : '');
      el.innerHTML = d + '<small>' + (post ? post[0] : '') + '</small>';
      if (post) { el.setAttribute('data-option', ''); el.dataset.day = d; }
      cal.appendChild(el);
    }

    cal.addEventListener('select', function (e) {
      var d = Number(e.detail.dataset.day), post = posts[d], type = TYPES[post[0]];
      document.getElementById('sel-date').textContent = '10월 ' + d + '일 · ' + type[0];
      document.getElementById('sel-topic').textContent = post[1];
      document.getElementById('sel-link').href = type[1];
    });
  })();
</script>
</body>
</html>
