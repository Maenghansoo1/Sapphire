<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="initial-scale=1, width=device-width, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' data: gap: https://ssl.gstatic.com https://fonts.googleapis.com https://fonts.gstatic.com 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com;">
<title>회원 탈퇴</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Fredoka:wght@600&display=swap">
<link rel="stylesheet" href="../css/hawe.css">
<style>
  .title { display: flex; flex-direction: column; gap: 6px; padding: 12px 0 16px; }
  .title h1 { font-size: 22px; font-weight: 700; }
  .notices { gap: 10px; padding: 16px; }
  .notice { display: flex; align-items: flex-start; gap: 8px; font-size: 14px; line-height: 1.5; }
  .notice .ic { width: 5px; height: 13px; margin-top: 4px; }
  .agree { display: flex; align-items: center; gap: 10px; height: 44px; font-size: 14px; white-space: nowrap; cursor: pointer; }
  .btn-row { padding-top: 10px; }
  .btn-row .btn { height: 54px; }
</style>
</head>
<body>
<main class="screen">
  <header class="hdr">
    <a class="hdr-btn" href="17-mypage.html" data-back aria-label="뒤로"><span class="ic"><img src="../img/ui/icons/chevron-left.svg" alt=""></span></a>
    <span class="hdr-title">회원 탈퇴</span>
    <div class="hdr-right"></div>
  </header>

  <div class="title">
    <h1>정말 떠나시나요?</h1>
    <p class="c-2" style="font-size: 14px;">탈퇴하기 전에 아래 내용을 꼭 확인해 주세요.</p>
  </div>

  <ul class="soft notices" style="margin: 0; list-style: none;">
    <li class="notice"><span class="ic"><img src="../img/ui/controls/bullet-danger.svg" alt=""></span>그동안 남긴 그림, 사진, 글, 음성과 댓글이 모두 삭제되고 되돌릴 수 없어요.</li>
    <li class="notice"><span class="ic"><img src="../img/ui/controls/bullet-danger.svg" alt=""></span>참여 중인 모든 그룹에서 나가게 돼요. 방장인 그룹은 가장 오래된 멤버에게 방장이 넘어가요.</li>
    <li class="notice"><span class="ic"><img src="../img/ui/controls/bullet-danger.svg" alt=""></span>같은 계정으로 다시 가입해도 이전 기록은 복구되지 않아요.</li>
  </ul>

  <div class="spacer"></div>
  <label class="agree"><input class="cb" type="checkbox" data-enables="#withdraw" data-enabled-class="btn-danger">위 내용을 모두 확인했고, 탈퇴에 동의해요</label>
  <div class="btn-row">
    <a class="btn btn-gray" href="17-mypage.html" data-back>계속 쓸게요</a>
    <a class="btn is-disabled" id="withdraw" href="a1-login.html">탈퇴하기</a>
  </div>
</main>
<script src="../cordova.js"></script>
<script src="../js/app.js"></script>
<script src="../js/hawe.js"></script>
</body>
</html>
