<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="initial-scale=1, width=device-width, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' data: gap: https://ssl.gstatic.com https://fonts.googleapis.com https://fonts.gstatic.com 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com;">
<title>로그인</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Fredoka:wght@600&display=swap">
<link rel="stylesheet" href="../css/hawe.css">
<style>
  .screen { gap: 32px; padding: 96px 24px 36px; }
  .intro { display: flex; flex-direction: column; gap: 14px; }
  .intro h1 { font-size: 28px; font-weight: 700; line-height: 1.35; }
  .form { display: flex; flex-direction: column; gap: 12px; }
  .links { display: flex; align-items: center; justify-content: center; gap: 16px; font-size: 14px; white-space: nowrap; }
  .links .sep { color: #d1d1d6; }
  .divider { display: flex; align-items: center; gap: 12px; font-size: 13px; color: var(--color-text-secondary); white-space: nowrap; }
  .divider::before, .divider::after { content: ''; flex: 1 0 0; height: 1px; background: var(--color-line); }
  .social { display: flex; flex-direction: column; gap: 10px; }
  .social .btn { gap: 8px; height: 52px; border-radius: 14px; font-size: 16px; }
  .btn-apple { background: var(--color-ink); color: #fff; }
  .btn-kakao { background: #fee500; color: #191919; }
</style>
</head>
<body>
<main class="screen">
  <section class="intro">
    <div class="lockup">
      <span class="ic s-30"><img src="../img/ui/logo/symbol-small-accent.svg" alt=""></span>
      <span class="wordmark">HA<span class="apos">'</span>WE</span>
    </div>
    <h1>다시 만나서 반가워요</h1>
  </section>

  <form class="form" action="04-home.html">
    <input class="input" type="email" placeholder="이메일" autocomplete="email">
    <input class="input" type="password" placeholder="비밀번호" autocomplete="current-password">
    <button class="btn btn-primary" type="submit">로그인</button>
    <div class="links">
      <a class="fw-6" href="a2-signup-account.html">회원가입</a>
      <span class="sep">|</span>
      <a class="c-2" href="#">비밀번호 찾기</a>
    </div>
  </form>

  <div class="divider">간편 로그인</div>

  <div class="social">
    <a class="btn btn-apple" href="04-home.html"><span class="ic s-18"><img src="../img/ui/social/apple.svg" alt=""></span>Apple로 계속하기</a>
    <a class="btn btn-kakao" href="04-home.html"><span class="ic s-18"><img src="../img/ui/social/kakao.svg" alt=""></span>카카오로 계속하기</a>
    <a class="btn btn-secondary" href="04-home.html"><span class="ic s-18"><img src="../img/ui/social/google.svg" alt=""></span>Google로 계속하기</a>
  </div>
</main>
<script src="../cordova.js"></script>
<script src="../js/app.js"></script>
<script src="../js/hawe.js"></script>
</body>
</html>
