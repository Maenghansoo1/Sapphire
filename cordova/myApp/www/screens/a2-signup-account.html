<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="initial-scale=1, width=device-width, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' data: gap: https://ssl.gstatic.com https://fonts.googleapis.com https://fonts.gstatic.com 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com;">
<title>회원가입 · 계정 정보</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Fredoka:wght@600&display=swap">
<link rel="stylesheet" href="../css/hawe.css">
<style>
  .screen { padding-bottom: 36px; }
  .body { display: flex; flex-direction: column; gap: 18px; padding-top: 12px; }
  .body h1 { font-size: 26px; font-weight: 700; }
  .terms { padding: 6px 14px; border: 1px solid var(--color-line); border-radius: 16px; }
  .term { display: flex; align-items: center; gap: 10px; height: 44px; font-size: 14px; cursor: pointer; }
  .term > span { flex: 1 0 0; min-width: 0; }
  .term.is-all { font-size: 15px; font-weight: 700; }
  .term .view { font-size: 13px; color: var(--color-text-secondary); text-decoration: underline; white-space: nowrap; }
</style>
</head>
<body>
<main class="screen px-24">
  <header class="hdr">
    <a class="hdr-btn" href="a1-login.html" data-back aria-label="뒤로"><span class="ic"><img src="../img/ui/icons/chevron-left.svg" alt=""></span></a>
    <div class="hdr-right fw-6 c-2" style="font-size: 14px;">1 / 2</div>
  </header>

  <form class="body" id="account" action="a3-signup-profile.html">
    <h1>계정을 만들어요</h1>
    <label class="field">
      <span class="field-label">이메일</span>
      <input class="input" type="email" placeholder="example@email.com" autocomplete="email">
    </label>
    <label class="field">
      <span class="field-label">비밀번호</span>
      <input class="input" type="password" placeholder="8자 이상, 영문·숫자 포함" autocomplete="new-password">
    </label>
    <label class="field">
      <span class="field-label">비밀번호 확인</span>
      <input class="input" type="password" placeholder="한 번 더 입력해 주세요" autocomplete="new-password">
    </label>

    <div class="terms">
      <label class="term is-all"><input class="cb" type="checkbox" data-check-all=".terms .term-item"><span>전체 동의</span></label>
      <label class="term"><input class="cb term-item" type="checkbox" checked><span>[필수] 서비스 이용약관 동의</span><a class="view" href="#">보기</a></label>
      <label class="term"><input class="cb term-item" type="checkbox" checked><span>[필수] 개인정보 처리방침 동의</span><a class="view" href="#">보기</a></label>
      <label class="term"><input class="cb term-item" type="checkbox"><span>[선택] 새 소식·이벤트 알림 받기</span></label>
    </div>
  </form>

  <div class="spacer"></div>
  <button class="btn btn-primary" type="submit" form="account">다음</button>
</main>
<script src="../cordova.js"></script>
<script src="../js/app.js"></script>
<script src="../js/hawe.js"></script>
</body>
</html>
