<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="initial-scale=1, width=device-width, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' data: gap: https://ssl.gstatic.com https://fonts.googleapis.com https://fonts.gstatic.com 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com;">
<title>미션 수행 · 음성</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Fredoka:wght@600&display=swap">
<link rel="stylesheet" href="../css/hawe.css">
<style>
  .mission-title { display: flex; flex-direction: column; gap: 4px; padding-top: 4px; }
  .recorder { display: flex; flex-direction: column; align-items: center; gap: 28px; padding-top: 72px; }
  .time { font-size: 44px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .wave.lg { height: 80px; }
  .controls { display: flex; align-items: center; justify-content: center; gap: 36px; padding-bottom: 32px; }
  .ctl { display: flex; align-items: center; justify-content: center; width: 56px; height: 56px; border: 1px solid var(--color-border); border-radius: 28px; font-size: 13px; font-weight: 600; }
  .rec { display: flex; align-items: center; justify-content: center; width: 84px; height: 84px; border-radius: 42px; background: var(--color-primary); }
  .rec::after { content: ''; width: 26px; height: 26px; border-radius: 6px; background: var(--color-bg); transition: border-radius .15s, width .15s, height .15s; }
  .rec.is-idle::after { width: 30px; height: 30px; border-radius: 50%; }
</style>
</head>
<body>
<main class="screen">
  <header class="hdr">
    <a class="hdr-btn" href="05-group-mission.html" data-back aria-label="닫기"><span class="ic s-22"><img src="../img/ui/icons/close.svg" alt=""></span></a>
    <div class="hdr-right"></div>
  </header>

  <div class="mission-title">
    <span class="fw-6 c-2" style="font-size: 13px;">오늘의 음성</span>
    <span class="fw-7" style="font-size: 20px;">오늘 하루를 10초로 말해줘</span>
  </div>

  <section class="recorder">
    <p class="time" id="time">00:07</p>
    <div class="wave lg" id="wave"></div>
    <p class="c-2" style="font-size: 13px;">최대 30초</p>
  </section>

  <div class="spacer"></div>
  <div class="controls">
    <button class="ctl" type="button" id="reset">다시</button>
    <button class="rec" type="button" id="rec" aria-label="녹음 정지"></button>
    <button class="ctl" type="button" aria-label="들어보기"><span class="ic s-20"><img src="../img/ui/icons/play.svg" alt=""></span></button>
  </div>
  <a class="btn btn-primary" href="13-result-voice.html">올리기</a>
</main>
<script src="../cordova.js"></script>
<script src="../js/app.js"></script>
<script src="../js/hawe.js"></script>
<script>
  (function () {
    // 녹음 중 목업: 막대 32개 중 앞쪽은 녹음된 높이(검정), 뒤쪽은 대기(연회색)
    var heights = [10, 18, 30, 44, 26, 52, 64, 40, 22, 36, 58, 70, 48, 30, 16, 24, 42, 60, 50, 34, 20, 12];
    var total = 32, wave = document.getElementById('wave'), time = document.getElementById('time');
    var rec = document.getElementById('rec'), secs = 7, timer = null;

    function render(n) {
      wave.innerHTML = '';
      for (var i = 0; i < total; i++) {
        var bar = document.createElement('i');
        if (i < n) { bar.className = 'ink'; bar.style.height = heights[i % heights.length] + 'px'; }
        else { bar.className = 'idle'; bar.style.height = '8px'; }
        wave.appendChild(bar);
      }
      time.textContent = '00:' + (secs < 10 ? '0' : '') + secs;
    }
    function bars() { return Math.min(total, Math.round(secs * heights.length / 7)); }
    function start() {
      rec.classList.remove('is-idle'); rec.setAttribute('aria-label', '녹음 정지');
      timer = setInterval(function () { if (secs >= 30) return stop(); secs++; render(bars()); }, 1000);
    }
    function stop() {
      clearInterval(timer); timer = null;
      rec.classList.add('is-idle'); rec.setAttribute('aria-label', '녹음 시작');
    }
    rec.addEventListener('click', function () { timer ? stop() : start(); });
    document.getElementById('reset').addEventListener('click', function () { stop(); secs = 0; render(0); });
    render(heights.length);
  })();
</script>
</body>
</html>
