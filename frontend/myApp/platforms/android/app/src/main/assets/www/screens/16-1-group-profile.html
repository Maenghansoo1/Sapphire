<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="initial-scale=1, width=device-width, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' data: gap: https://ssl.gstatic.com https://fonts.googleapis.com https://fonts.gstatic.com 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com;">
<title>그룹 내 프로필</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Fredoka:wght@600&display=swap">
<link rel="stylesheet" href="../css/hawe.css">
<style>
  .screen { padding-bottom: 36px; }
  .body { display: flex; flex-direction: column; gap: 18px; padding-top: 8px; }
  .use-default { flex-direction: row; align-items: center; justify-content: space-between; padding: 14px 16px; cursor: pointer; }
  .use-default .txt { display: flex; flex-direction: column; gap: 2px; white-space: nowrap; }
  .preview { display: flex; align-items: center; gap: 16px; }
  .preview-ring { display: flex; align-items: center; justify-content: center; width: 80px; height: 80px; border-radius: 50%; background: var(--color-surface); }
  .preview-text { display: flex; flex-direction: column; gap: 4px; white-space: nowrap; }
  .grid { display: flex; flex-wrap: wrap; gap: 10px 22px; }
  .opt { display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 12px; font-weight: 500; color: var(--color-text-secondary); }
  .ring { display: flex; align-items: center; justify-content: center; width: 64px; height: 64px; border-radius: 50%; background: var(--color-surface); }
  .opt.is-selected { font-weight: 700; color: var(--color-ink); }
  .opt.is-selected .ring { border: 2.5px solid var(--color-ink); background: var(--color-bg); }
  .ring.is-photo { border: 2px dashed var(--color-muted); }
  .count { font-size: 13px; color: var(--color-text-secondary); text-align: right; }
  /* 기본 프로필 사용 중이면 커스텀 영역 비활성 */
  .body.is-default .custom { opacity: .4; pointer-events: none; }
</style>
</head>
<body>
<main class="screen px-24">
  <header class="hdr">
    <a class="hdr-btn" href="16-group-settings.html" data-back aria-label="뒤로"><span class="ic"><img src="../img/ui/icons/chevron-left.svg" alt=""></span></a>
    <span class="hdr-title">그룹 내 프로필</span>
    <div class="hdr-right"></div>
  </header>

  <form class="body" id="profile" action="16-group-settings.html">
    <p class="c-2" style="font-size: 14px; line-height: 1.5;">'컴공 동기' 그룹에서만 이렇게 보여요. 다른 그룹에는 영향이 없어요.</p>

    <label class="soft use-default">
      <span class="txt">
        <span class="fw-6" style="font-size: 15px;">기본 프로필 사용</span>
        <span class="c-2" style="font-size: 12px;">마이페이지의 프로필(몽실이 · 하늘)을 그대로 써요</span>
      </span>
      <input class="tgl" type="checkbox" id="use-default">
    </label>

    <div class="preview custom" id="preview">
      <div class="preview-ring"><span class="ic s-64"><img src="../img/ui/chars/bear.svg" alt=""></span></div>
      <div class="preview-text">
        <span class="c-2" style="font-size: 13px;">그룹 멤버에게 보이는 모습</span>
        <span class="fw-7" style="font-size: 20px;" id="preview-name">과대표 하늘</span>
      </div>
    </div>

    <div class="grid custom" data-select data-char-grid="#preview">
      <button class="opt" type="button" data-option data-name="몽실이"><span class="ring"><span class="ic s-48"><img src="../img/ui/chars/mongsil.svg" alt=""></span></span>몽실이</button>
      <button class="opt is-selected" type="button" data-option data-name="곰돌이"><span class="ring"><span class="ic s-48"><img src="../img/ui/chars/bear.svg" alt=""></span></span>곰돌이</button>
      <button class="opt" type="button" data-option data-name="꽃님"><span class="ring"><span class="ic s-48"><img src="../img/ui/chars/flower.svg" alt=""></span></span>꽃님</button>
      <button class="opt" type="button" data-option data-name="잎사귀"><span class="ring"><span class="ic s-48"><img src="../img/ui/chars/leaf.svg" alt=""></span></span>잎사귀</button>
      <button class="opt" type="button" data-option data-name="물방울"><span class="ring"><span class="ic s-48"><img src="../img/ui/chars/drop.svg" alt=""></span></span>물방울</button>
      <button class="opt" type="button" data-option data-name="필름이"><span class="ring"><span class="ic s-48"><img src="../img/ui/chars/film.svg" alt=""></span></span>필름이</button>
      <button class="opt" type="button" data-option data-name="감자"><span class="ring"><span class="ic s-48"><img src="../img/ui/chars/potato.svg" alt=""></span></span>감자</button>
      <button class="opt" type="button" data-option><span class="ring is-photo"><span class="ic s-22"><img src="../img/ui/icons/image.svg" alt=""></span></span>내 사진</button>
    </div>

    <label class="field custom">
      <span class="field-label">그룹 내 닉네임</span>
      <input class="input" type="text" value="과대표 하늘" maxlength="10" data-count="#nick-count" id="nick">
      <span class="count" id="nick-count">6 / 10</span>
    </label>
  </form>

  <div class="spacer"></div>
  <button class="btn btn-primary" type="submit" form="profile">저장</button>
</main>
<script src="../cordova.js"></script>
<script src="../js/app.js"></script>
<script src="../js/hawe.js"></script>
<script>
  // 미리보기 이름은 캐릭터 이름이 아니라 그룹 내 닉네임을 보여줘요
  var nick = document.getElementById('nick'), name = document.getElementById('preview-name');
  nick.addEventListener('input', function () { name.textContent = nick.value; });
  document.getElementById('use-default').addEventListener('change', function () {
    document.getElementById('profile').classList.toggle('is-default', this.checked);
  });
</script>
</body>
</html>
