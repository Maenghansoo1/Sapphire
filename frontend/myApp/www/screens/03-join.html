<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="initial-scale=1, width=device-width, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' data: gap: https://ssl.gstatic.com https://fonts.googleapis.com https://fonts.gstatic.com 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com;">
<title>초대 코드로 참여</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Fredoka:wght@600&display=swap">
<link rel="stylesheet" href="../css/hawe.css">
<style>
  .screen { padding-bottom: 40px; }
  .body { display: flex; flex-direction: column; gap: 14px; padding-top: 16px; }
  .title { display: flex; flex-direction: column; gap: 8px; }
  .title h1 { font-size: 26px; font-weight: 700; }
  .title p { font-size: 15px; color: var(--color-text-secondary); }
  .code { display: flex; gap: 8px; }
  .code input {
    flex: 1 0 0; min-width: 0; height: 58px; padding: 0;
    border: 1.5px solid transparent; border-radius: 14px; background: var(--color-surface);
    font-size: 24px; font-weight: 700; text-align: center; text-transform: uppercase; outline: none;
  }
  .code input:placeholder-shown { background: var(--color-bg); border-color: var(--color-line); }
  .code input:focus { background: var(--color-bg); border-color: var(--color-ink); }
  .group { gap: 12px; padding: 18px; border-radius: 18px; }
  .group-name { display: flex; flex-direction: column; gap: 4px; }
</style>
</head>
<body>
<main class="screen px-24">
  <header class="hdr">
    <a class="hdr-btn" href="01-start.html" data-back aria-label="뒤로"><span class="ic"><img src="../img/ui/icons/chevron-left.svg" alt=""></span></a>
    <div class="hdr-right"></div>
  </header>

  <form class="body" id="join" action="05-group-mission.html">
    <div class="title">
      <h1>초대 코드 입력</h1>
      <p>친구에게 받은 6자리 코드를 입력해 주세요.</p>
    </div>

    <div class="code" data-code>
      <input value="K" maxlength="1" placeholder=" " autocapitalize="characters" aria-label="코드 1번째">
      <input value="7" maxlength="1" placeholder=" " autocapitalize="characters" aria-label="코드 2번째">
      <input value="Q" maxlength="1" placeholder=" " autocapitalize="characters" aria-label="코드 3번째">
      <input value="2" maxlength="1" placeholder=" " autocapitalize="characters" aria-label="코드 4번째">
      <input value="P" maxlength="1" placeholder=" " autocapitalize="characters" aria-label="코드 5번째">
      <input maxlength="1" placeholder=" " autocapitalize="characters" aria-label="코드 6번째" autofocus>
    </div>
    <p class="c-2" style="font-size: 13px;">링크로 받았다면 링크를 누르면 자동으로 입력돼요.</p>

    <div class="card group">
      <span class="fw-6 c-2" style="font-size: 13px;">참여할 그룹</span>
      <div class="group-name">
        <span class="fw-7" style="font-size: 18px;">컴공 동기</span>
        <span class="c-2" style="font-size: 14px;">친구 · 4 / 6명 참여 중</span>
      </div>
      <div class="members">
        <span class="avatar a-32"><span class="ic"><img src="../img/ui/chars/potato.svg" alt=""></span></span>
        <span class="decor" style="--d: 19px;"><span class="ic s-13"><img src="../img/ui/decor/friend-13.svg" alt=""></span></span>
        <span class="avatar a-32"><span class="ic"><img src="../img/ui/chars/flower.svg" alt=""></span></span>
        <span class="decor" style="--d: 19px;"><span class="ic s-13"><img src="../img/ui/decor/friend-13.svg" alt=""></span></span>
        <span class="avatar a-32"><span class="ic"><img src="../img/ui/chars/drop.svg" alt=""></span></span>
        <span class="decor" style="--d: 19px;"><span class="ic s-13"><img src="../img/ui/decor/friend-13.svg" alt=""></span></span>
        <span class="avatar a-32"><span class="ic"><img src="../img/ui/chars/film.svg" alt=""></span></span>
      </div>
    </div>
  </form>

  <div class="spacer"></div>
  <button class="btn btn-primary" type="submit" form="join">참여하기</button>
</main>
<script src="../cordova.js"></script>
<script src="../js/app.js"></script>
<script src="../js/hawe.js"></script>
</body>
</html>
