<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="initial-scale=1, width=device-width, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' data: gap: https://ssl.gstatic.com https://fonts.googleapis.com https://fonts.gstatic.com 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com;">
<title>결과 공개 · 글</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Fredoka:wght@600&display=swap">
<link rel="stylesheet" href="../css/hawe.css">
<style>
  .hdr-title { font-size: 15px; font-weight: 600; }
  .title { display: flex; flex-direction: column; gap: 6px; padding: 8px 0 18px; }
  .title h1 { font-size: 22px; font-weight: 700; }
  .cards { display: flex; flex-direction: column; gap: 12px; }
  .note { gap: 12px; padding: 18px; border-radius: 20px; }
  .note-hd { display: flex; align-items: center; gap: 8px; white-space: nowrap; }
  .note-body { font-size: 16px; line-height: 1.65; }
  .note-ft { display: flex; gap: 14px; font-size: 12px; color: var(--color-text-secondary); white-space: nowrap; }
</style>
</head>
<body>
<main class="screen">
  <header class="hdr">
    <a class="hdr-btn" href="15-calendar.html" data-back aria-label="뒤로"><span class="ic"><img src="../img/ui/icons/chevron-left.svg" alt=""></span></a>
    <span class="hdr-title">10월 9일 · 글</span>
    <div class="hdr-right"></div>
  </header>

  <div class="title">
    <h1>오늘 들은 가장 따뜻한 말</h1>
    <p class="c-2" style="font-size: 13px;">5명 모두 완료 · 글을 눌러 댓글을 남겨보세요</p>
  </div>

  <section class="cards">
    <a class="soft note" href="14-detail-text.html">
      <span class="note-hd">
        <span class="avatar a-30 on-surface"><span class="ic"><img src="../img/ui/chars/potato.svg" alt=""></span></span>
        <span class="fw-6" style="font-size: 14px;">민준</span>
        <span class="c-2" style="font-size: 12px;">오전 8:50</span>
      </span>
      <p class="note-body">편의점 사장님이 "오늘도 수고 많았어요" 하면서 영수증을 건네주셨다. 별말 아닌데 하루가 풀렸음.</p>
      <span class="note-ft"><span>좋아요 4</span><span>댓글 3</span></span>
    </a>
    <a class="soft note" href="14-detail-text.html">
      <span class="note-hd">
        <span class="avatar a-30 on-surface"><span class="ic"><img src="../img/ui/chars/flower.svg" alt=""></span></span>
        <span class="fw-6" style="font-size: 14px;">지우</span>
        <span class="c-2" style="font-size: 12px;">오후 1:15</span>
      </span>
      <p class="note-body">엄마가 전화로 밥은 잘 먹고 다니냐고 물어봤다.</p>
      <span class="note-ft"><span>좋아요 3</span><span>댓글 1</span></span>
    </a>
    <a class="soft note" href="14-detail-text.html">
      <span class="note-hd">
        <span class="avatar a-30 on-surface"><span class="ic"><img src="../img/ui/chars/drop.svg" alt=""></span></span>
        <span class="fw-6" style="font-size: 14px;">서연</span>
        <span class="c-2" style="font-size: 12px;">오후 6:02</span>
      </span>
      <p class="note-body">조별과제 팀원이 네 덕분에 끝났다고 말해줬다. 사실 나도 덕분이었는데.</p>
      <span class="note-ft"><span>좋아요 5</span><span>댓글 2</span></span>
    </a>
    <a class="soft note" href="14-detail-text.html">
      <span class="note-hd">
        <span class="avatar a-30 on-surface"><span class="ic"><img src="../img/ui/chars/bear.svg" alt=""></span></span>
        <span class="fw-6" style="font-size: 14px;">과대표 하늘</span>
        <span class="c-2" style="font-size: 12px;">오후 10:30</span>
      </span>
      <p class="note-body">교수님이 질문 좋다고 하셨다.</p>
      <span class="note-ft"><span>좋아요 2</span><span>댓글 0</span></span>
    </a>
  </section>
</main>
<script src="../cordova.js"></script>
<script src="../js/app.js"></script>
<script src="../js/hawe.js"></script>
</body>
</html>
