# XcodeGen 설정 — Mac에서 `xcodegen generate` 로 HAWE.xcodeproj 를 만들어요.
name: HAWE
options:
  bundleIdPrefix: com.sapphire
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: ko

configFiles:
  Debug: Config.xcconfig
  Release: Config.xcconfig

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  HAWE:
    type: application
    platform: iOS
    sources:
      - path: HAWE
        excludes:
          - "Resources/Fonts/*.txt"
    info:
      path: HAWE/App/Info.plist
      properties:
        CFBundleDisplayName: "HA'WE"
        CFBundleDevelopmentRegion: ko
        UILaunchScreen: {}
        UIUserInterfaceStyle: Light
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIAppFonts:
          - IBMPlexSansKR-Regular.ttf
          - IBMPlexSansKR-Medium.ttf
          - IBMPlexSansKR-SemiBold.ttf
          - IBMPlexSansKR-Bold.ttf
          - Fredoka-SemiBold.ttf
        SUPABASE_URL: $(SUPABASE_URL)
        SUPABASE_ANON_KEY: $(SUPABASE_ANON_KEY)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sapphire.hawe
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES
