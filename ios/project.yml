# XcodeGen 설정 — Mac에서 `xcodegen generate` 로 HAWE.xcodeproj 를 만들어요.
name: HAWE
options:
  bundleIdPrefix: com.sapphire
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: ko

configFiles:
  Debug: Config.xcconfig
  Release: Config.xcconfig

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  HAWE:
    type: application
    platform: iOS
    sources:
      - path: HAWE
        excludes:
          - "Resources/Fonts/*.txt"
    info:
      path: HAWE/App/Info.plist
      properties:
        CFBundleDisplayName: "HA'WE"
        CFBundleDevelopmentRegion: ko
        UILaunchScreen: {}
        UIUserInterfaceStyle: Light
        NSCameraUsageDescription: "오늘의 미션 사진을 찍으려면 카메라 권한이 필요해요."
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIAppFonts:
          - IBMPlexSansKR-Regular.ttf
          - IBMPlexSansKR-Medium.ttf
          - IBMPlexSansKR-SemiBold.ttf
          - IBMPlexSansKR-Bold.ttf
          - Fredoka-SemiBold.ttf
        API_BASE_URL: $(API_BASE_URL)
        # EC2 서버(http://43.202.49.179:8080)는 IP 주소라 예외 도메인을 쓸 수 없어 http 를 전부 허용해요. (localhost 포함)
        # NSAllowsLocalNetworking 을 같이 두면 iOS 가 NSAllowsArbitraryLoads 를 무시하니 넣지 마세요.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        SUPABASE_URL: $(SUPABASE_URL)
        SUPABASE_ANON_KEY: $(SUPABASE_ANON_KEY)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sapphire.hawe
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES
    scheme:
      testTargets:
        - HAWETests

  # 단위 테스트 — Android 단위 테스트(app/src/test)를 옮긴 것. 그림 모델 골든은 앱 번들의 Core ML 모델로 확인해요.
  HAWETests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: HAWETests
    dependencies:
      - target: HAWE
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.sapphire.hawe.tests
        TARGETED_DEVICE_FAMILY: "1"
