<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>그림 모으기</title>
<style>
  :root {
    --bg: #ffffff; --surface: #f6f6f7; --line: #ececee; --text: #111111; --text2: #6e6e73;
    --accent: #67a0c3; --accent-pressed: #558bb0; --accent-subtle: #eaf1f7; --danger: #e5484d;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); overscroll-behavior: none; }
  body { font: 15px/1.4 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif;
         -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  main { max-width: 480px; margin: 0 auto; padding: 12px 20px calc(20px + env(safe-area-inset-bottom)); }
  header { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 36px; }
  header h1 { font-size: 15px; font-weight: 600; margin: 0; }
  .who { border: 1px solid var(--line); background: var(--surface); color: var(--text); border-radius: 999px; padding: 6px 12px; font: inherit; font-size: 13px; }
  .bar { height: 4px; background: var(--line); border-radius: 2px; margin: 8px 0 14px; overflow: hidden; }
  .bar > div { height: 100%; width: 0; background: var(--accent); transition: width .3s; }
  .prompt { color: var(--text2); font-size: 13px; }
  .topic { font-size: 28px; font-weight: 700; margin: 2px 0 12px; }
  .topic small { font-size: 14px; font-weight: 400; color: var(--text2); margin-left: 6px; }
  button { touch-action: manipulation; }
  #board { position: relative; width: 100%; height: 360px; height: clamp(240px, calc(100dvh - 330px), 400px); border: 1px solid var(--line);
           border-radius: 16px; background: #fff; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; }
  .row { display: flex; align-items: center; gap: 8px; margin-top: 12px; }
  .spacer { flex: 1; }
  .chip { border: 1px solid var(--line); background: var(--bg); color: var(--text); border-radius: 999px; padding: 6px 14px; font: inherit; font-size: 14px; }
  .chip[aria-pressed="true"] { background: var(--accent-subtle); border-color: var(--accent); color: var(--accent-pressed); font-weight: 600; }
  .dot { width: 32px; height: 32px; border-radius: 50%; border: 1px solid var(--line); background: var(--bg); display: grid; place-items: center; padding: 0; }
  .dot span { display: block; border-radius: 50%; background: var(--text); }
  .dot[aria-pressed="true"] { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-subtle); }
  .icon { width: 36px; height: 36px; border: 0; background: none; font-size: 20px; color: var(--text); padding: 0; }
  .icon:disabled { color: var(--line); }
  .swatch { width: 28px; height: 28px; border-radius: 50%; border: 2px solid #fff; box-shadow: 0 0 0 1px var(--line); padding: 0; }
  .swatch[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--accent); }
  .colors[hidden] { display: none; }
  .actions { display: grid; grid-template-columns: 1fr 1fr 2fr; gap: 8px; margin-top: 16px; }
  .btn { border: 0; border-radius: 12px; padding: 14px 8px; font: inherit; font-weight: 600; background: var(--surface); color: var(--text); }
  .btn.primary { background: var(--accent); color: #fff; }
  .btn:disabled { opacity: .45; }
  .hint { color: var(--text2); font-size: 12px; margin-top: 10px; }
  #toast { position: fixed; left: 50%; bottom: calc(16px + env(safe-area-inset-bottom)); transform: translateX(-50%); width: min(440px, calc(100% - 32px));
           background: #2b2b2e; color: #fff; border-radius: 12px; padding: 12px 14px; display: flex; align-items: center; gap: 10px;
           font-size: 14px; opacity: 0; pointer-events: none; transition: opacity .2s; }
  #toast.show { opacity: 1; pointer-events: auto; }
  #toast button { margin-left: auto; border: 0; background: none; color: #9fc6de; font: inherit; font-weight: 600; padding: 4px; }
  #overlay { position: fixed; inset: 0; background: var(--bg); display: none; align-items: center; justify-content: center; padding: 24px; }
  #overlay.show { display: flex; }
  .card { width: 100%; max-width: 360px; }
  .card h2 { font-size: 22px; margin: 0 0 6px; }
  .card p { color: var(--text2); margin: 0 0 18px; font-size: 14px; }
  .people { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .people button { border: 1px solid var(--line); background: var(--surface); border-radius: 14px; padding: 16px 8px; font: inherit; color: var(--text); }
  .people b { display: block; font-size: 20px; }
  .custom { display: flex; gap: 8px; margin-top: 14px; }
  .custom input { flex: 1; border: 1px solid var(--line); border-radius: 12px; padding: 12px; font: inherit; -webkit-user-select: text; user-select: text; }
  .error { color: var(--danger); font-size: 13px; margin-top: 10px; min-height: 18px; }
</style>
</head>
<body>
<main>
  <header>
    <h1>그림 모으기</h1>
    <button class="who" id="who" type="button">이름 선택</button>
  </header>
  <div class="bar" aria-hidden="true"><div id="progress"></div></div>
  <div class="prompt" id="prompt">그려 주세요</div>
  <div class="topic" id="topic">…</div>
  <div id="board"><canvas id="canvas" aria-label="그림판"></canvas></div>
  <div class="row">
    <button class="chip" id="pen" type="button" aria-pressed="true">펜</button>
    <button class="chip" id="eraser" type="button" aria-pressed="false">지우개</button>
    <span class="spacer"></span>
    <span id="widths" class="row" style="margin:0;gap:6px"></span>
    <button class="icon" id="undo" type="button" aria-label="되돌리기">↶</button>
    <button class="icon" id="redo" type="button" aria-label="다시 실행">↷</button>
  </div>
  <div class="row colors" id="colors"></div>
  <div class="actions">
    <button class="btn" id="skip" type="button">건너뛰기</button>
    <button class="btn" id="clear" type="button">다 지우기</button>
    <button class="btn primary" id="save" type="button" disabled>저장하고 다음</button>
  </div>
  <div class="hint">앱에서 그리듯 손가락으로 자연스럽게 그려 주세요. 글자·숫자는 쓰지 않아요. 어떻게 그릴지 모르겠으면 건너뛰기.</div>
</main>

<div id="toast" role="status"><span id="toast-text"></span><button id="toast-action" type="button" hidden>방금 것 지우기</button></div>

<div id="overlay">
  <div class="card">
    <h2>누가 그리나요?</h2>
    <p>그린 사람별로 폴더가 나뉘어요. 다른 휴대폰으로 이어 그려도 같은 이름을 고르면 이어서 세요.</p>
    <div class="people" id="people"></div>
    <div class="custom">
      <input id="custom" placeholder="다른 이름 (한글·영문·숫자)" autocomplete="off" autocapitalize="off">
      <button class="btn" id="custom-ok" type="button">확인</button>
    </div>
    <div class="error" id="error"></div>
  </div>
</div>

<script>
// 앱(DrawingModel.kt·DrawingRenderer.kt)과 같은 값
const PALETTE = ["#111111", "#8E8E93", "#E5484D", "#F5A524", "#F2D74E", "#30A46C", "#2F5BFF"];
const WIDTHS = [{ width: 3, dot: 4, label: "가는 굵기" }, { width: 6, dot: 8, label: "보통 굵기" }, { width: 12, dot: 14, label: "굵은 굵기" }];
const ERASER_SCALE = 3;
const PNG_SCALE = 2;
const PEOPLE = ["우준", "경환", "찬희", "한수"];  // 고른 이름이 그대로 저장 폴더 이름이 된다

const $ = (id) => document.getElementById(id);
const canvas = $("canvas");
const ctx = canvas.getContext("2d");
const state = {
  person: null, categories: [], others: [], counts: {}, goal: 75, current: null, skipped: new Set(),
  tool: "pen", widthIndex: 1, colorIndex: 0, strokes: [], redo: [], active: null, pointer: null,
  startedAt: null, last: null, saving: false, size: { w: 1, h: 1 },
};

function readPerson() { try { return localStorage.getItem("quickdraw-name"); } catch { return null; } }
function writePerson(value) { try { localStorage.setItem("quickdraw-name", value); } catch {} }

// ---- 그리기 (앱 drawStrokes 와 같은 방식: 둥근 끝·이음, 점 사이를 중간점까지 2차 곡선) ----
function drawStrokes(target, strokes, scale) {
  for (const stroke of strokes) {
    const points = stroke.points;
    if (!points.length) continue;
    target.save();
    target.globalCompositeOperation = stroke.eraser ? "destination-out" : "source-over";
    target.strokeStyle = target.fillStyle = stroke.color;
    target.lineWidth = stroke.width * scale;
    target.lineCap = "round";
    target.lineJoin = "round";
    target.beginPath();
    const first = points[0];
    if (points.length === 1) {
      target.arc(first.x * scale, first.y * scale, target.lineWidth / 2, 0, Math.PI * 2);
      target.fill();
    } else {
      target.moveTo(first.x * scale, first.y * scale);
      for (let i = 1; i < points.length; i++) {
        const previous = points[i - 1], next = points[i];
        target.quadraticCurveTo(previous.x * scale, previous.y * scale,
          (previous.x + next.x) * scale / 2, (previous.y + next.y) * scale / 2);
      }
      const last = points[points.length - 1];
      target.lineTo(last.x * scale, last.y * scale);
      target.stroke();
    }
    target.restore();
  }
}

function visibleStrokes() { return state.active ? [...state.strokes, state.active] : state.strokes; }

let frame = 0;
function redraw() {
  if (frame) return;
  frame = requestAnimationFrame(() => {
    frame = 0;
    const ratio = window.devicePixelRatio || 1;
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    drawStrokes(ctx, visibleStrokes(), ratio);
  });
}

function resize() {
  const ratio = window.devicePixelRatio || 1;
  const rect = canvas.getBoundingClientRect();
  state.size = { w: rect.width, h: rect.height };
  canvas.width = Math.max(1, Math.round(rect.width * ratio));
  canvas.height = Math.max(1, Math.round(rect.height * ratio));
  redraw();
}

// 앱 renderDrawingPng: 화면 크기 × 2, 투명 잉크 층(지우개 적용)을 흰 바탕에 합친다
function exportPng() {
  const width = Math.max(1, Math.round(state.size.w * PNG_SCALE));
  const height = Math.max(1, Math.round(state.size.h * PNG_SCALE));
  const ink = document.createElement("canvas");
  ink.width = width; ink.height = height;
  drawStrokes(ink.getContext("2d"), state.strokes, PNG_SCALE);
  const flat = document.createElement("canvas");
  flat.width = width; flat.height = height;
  const flatCtx = flat.getContext("2d");
  flatCtx.fillStyle = "#ffffff";
  flatCtx.fillRect(0, 0, width, height);
  flatCtx.drawImage(ink, 0, 0);
  return flat.toDataURL("image/png");
}

function pointOf(event) {
  const rect = canvas.getBoundingClientRect();
  return { x: event.clientX - rect.left, y: event.clientY - rect.top };
}

canvas.addEventListener("pointerdown", (event) => {
  if (state.pointer !== null || !state.current) return;
  state.pointer = event.pointerId;
  canvas.setPointerCapture(event.pointerId);
  if (state.startedAt === null) state.startedAt = performance.now();
  const eraser = state.tool === "eraser";
  state.active = {
    points: [pointOf(event)], eraser,
    color: eraser ? "#000000" : PALETTE[state.colorIndex],
    width: WIDTHS[state.widthIndex].width * (eraser ? ERASER_SCALE : 1),
  };
  redraw();
  event.preventDefault();
});
canvas.addEventListener("pointermove", (event) => {
  if (event.pointerId !== state.pointer || !state.active) return;
  state.active.points.push(pointOf(event));
  redraw();
});
function endStroke(event) {
  if (event.pointerId !== state.pointer) return;
  state.pointer = null;
  if (state.active) { state.strokes.push(state.active); state.redo = []; }
  state.active = null;
  redraw();
  updateTools();
}
canvas.addEventListener("pointerup", endStroke);
canvas.addEventListener("pointercancel", endStroke);

// ---- 도구 ----
function updateTools() {
  $("pen").setAttribute("aria-pressed", String(state.tool === "pen"));
  $("eraser").setAttribute("aria-pressed", String(state.tool === "eraser"));
  document.querySelectorAll("#widths .dot").forEach((dot, i) => dot.setAttribute("aria-pressed", String(i === state.widthIndex)));
  document.querySelectorAll("#colors .swatch").forEach((swatch, i) => swatch.setAttribute("aria-pressed", String(i === state.colorIndex)));
  $("colors").hidden = state.tool !== "pen";
  $("undo").disabled = !state.strokes.length;
  $("redo").disabled = !state.redo.length;
  $("save").disabled = state.saving || !state.current || !state.strokes.some((s) => !s.eraser);
}

WIDTHS.forEach((item, i) => {
  const dot = document.createElement("button");
  dot.type = "button"; dot.className = "dot"; dot.setAttribute("aria-label", item.label);
  const inner = document.createElement("span");
  inner.style.width = inner.style.height = item.dot + "px";
  dot.append(inner);
  dot.addEventListener("click", () => { state.widthIndex = i; updateTools(); });
  $("widths").append(dot);
});
PALETTE.forEach((color, i) => {
  const swatch = document.createElement("button");
  swatch.type = "button"; swatch.className = "swatch"; swatch.style.background = color;
  swatch.setAttribute("aria-label", `색 ${i + 1}`);
  swatch.addEventListener("click", () => { state.colorIndex = i; state.tool = "pen"; updateTools(); });
  $("colors").append(swatch);
});
$("pen").addEventListener("click", () => { state.tool = "pen"; updateTools(); });
$("eraser").addEventListener("click", () => { state.tool = "eraser"; updateTools(); });
$("undo").addEventListener("click", () => { if (state.strokes.length) state.redo.push(state.strokes.pop()); redraw(); updateTools(); });
$("redo").addEventListener("click", () => { if (state.redo.length) state.strokes.push(state.redo.pop()); redraw(); updateTools(); });
$("clear").addEventListener("click", () => { clearBoard(); });

function clearBoard() {
  state.strokes = []; state.redo = []; state.active = null; state.startedAt = null;
  redraw(); updateTools();
}

// ---- 범주·진행 ----
const OTHER = "_other";
function total() { return state.categories.reduce((sum, c) => sum + (state.counts[c.quickdraw] || 0), 0); }

function pickNext() {
  // 6장에 1장꼴로 범주 밖 단어 (모델이 "잘 모르겠어요" 라고 하는지 재는 용도)
  if (state.others.length && state.current?.quickdraw !== OTHER && (state.counts[OTHER] || 0) * 5 < total()) {
    const fresh = state.others.filter((w) => !state.skipped.has(OTHER + w));
    const words = fresh.length ? fresh : state.others;
    const word = words[Math.floor(Math.random() * words.length)];
    return { quickdraw: OTHER, ko: word, word };
  }
  // 이 사람이 가장 적게 그린 범주 중 무작위. 이번에 건너뛴 범주와 방금 범주는 다른 게 남아 있으면 피한다
  const fresh = state.categories.filter((c) => !state.skipped.has(c.quickdraw) && c.quickdraw !== state.current?.quickdraw);
  const pool = fresh.length ? fresh : state.categories;
  const least = Math.min(...pool.map((c) => state.counts[c.quickdraw] || 0));
  const choices = pool.filter((c) => (state.counts[c.quickdraw] || 0) === least);
  return choices[Math.floor(Math.random() * choices.length)];
}

function showCurrent() {
  const done = total();
  $("progress").style.width = Math.min(100, (done / state.goal) * 100) + "%";
  $("who").textContent = `${state.person} · ${done}/${state.goal}`;
  $("prompt").textContent = done >= state.goal ? "목표 달성! 더 그려도 좋아요" : "그려 주세요";
  const topic = $("topic");
  topic.textContent = state.current ? state.current.ko : "…";
  if (state.current) {
    const small = document.createElement("small");
    small.textContent = state.current.word ? "보너스" : state.current.quickdraw;
    topic.append(small);
  }
  updateTools();
}

$("skip").addEventListener("click", () => {
  if (!state.current) return;
  state.skipped.add(state.current.quickdraw + (state.current.word || ""));
  state.current = pickNext();
  clearBoard(); showCurrent();
});

async function post(path, body) {
  const response = await fetch(path, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
  const data = await response.json().catch(() => ({}));
  if (!response.ok) throw new Error(data.error || `HTTP ${response.status}`);
  return data;
}

$("save").addEventListener("click", async () => {
  if (state.saving || !state.current) return;
  state.saving = true; updateTools();
  const category = state.current;
  const round = (v) => Math.round(v * 10) / 10;
  try {
    const data = await post("/api/drawings", {
      person: state.person, category: category.quickdraw, word: category.word, png: exportPng(),
      canvas: { widthDp: round(state.size.w), heightDp: round(state.size.h), pngScale: PNG_SCALE },
      draw_ms: state.startedAt === null ? null : Math.round(performance.now() - state.startedAt),
      strokes: state.strokes.map((s) => ({ color: s.color, widthDp: s.width, eraser: s.eraser,
        points: s.points.map((p) => [round(p.x), round(p.y)]) })),
    });
    state.counts = data.counts;
    state.last = { file: data.file, category };
    toast(`저장했어요: ${category.ko}`, true);
    state.current = pickNext();
    clearBoard();
  } catch (error) {
    toast(`저장하지 못했어요 (${error.message}). PC 서버가 켜져 있는지 확인해 주세요.`, false);
  } finally {
    state.saving = false; showCurrent();
  }
});

let toastTimer = 0;
function toast(text, undoable) {
  $("toast-text").textContent = text;
  $("toast-action").hidden = !undoable;
  $("toast").classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => $("toast").classList.remove("show"), 5000);
}
$("toast-action").addEventListener("click", async () => {
  const last = state.last;
  if (!last) return;
  try {
    const data = await post("/api/drawings/delete", { person: state.person, file: last.file });
    state.counts = data.counts;
    state.last = null;
    if (!state.strokes.length) state.current = last.category;  // 아직 새로 그리기 전이면 같은 범주를 다시 그린다
    toast(`지웠어요: ${last.category.ko} — 다시 그려 주세요`, false);
    showCurrent();
  } catch (error) {
    toast(`지우지 못했어요 (${error.message})`, false);
  }
});

// ---- 이름 ----
PEOPLE.forEach((name) => {
  const button = document.createElement("button");
  button.type = "button";
  const b = document.createElement("b"); b.textContent = name;
  button.append(b);
  button.addEventListener("click", () => choosePerson(name));
  $("people").append(button);
});
$("custom-ok").addEventListener("click", () => choosePerson($("custom").value.trim().toLowerCase()));
$("who").addEventListener("click", () => $("overlay").classList.add("show"));

async function choosePerson(code) {
  if (!/^[a-z0-9_가-힣-]{1,20}$/.test(code)) { $("error").textContent = "한글·영문 소문자·숫자 1~20자로 적어 주세요."; return; }
  $("error").textContent = "";
  try {
    const response = await fetch(`/api/state?person=${encodeURIComponent(code)}`);
    if (!response.ok) throw new Error(`HTTP ${response.status}`);
    const data = await response.json();
    state.person = code; writePerson(code);
    state.categories = data.categories; state.others = data.others || []; state.counts = data.counts; state.goal = data.goal;
    state.skipped.clear(); state.last = null;
    state.current = pickNext();
    clearBoard();
    $("overlay").classList.remove("show");
    showCurrent();
  } catch (error) {
    $("overlay").classList.add("show");
    $("error").textContent = "PC 서버에 연결하지 못했어요. collect.py 가 보여 준 주소로 열었는지 확인해 주세요.";
  }
}

window.addEventListener("resize", resize);
resize();
updateTools();
const saved = readPerson();
if (saved) choosePerson(saved); else $("overlay").classList.add("show");
</script>
</body>
</html>
