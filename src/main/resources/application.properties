spring.application.name=hawe
spring.config.import=optional:file:.env[.properties]

# Local MariaDB by default; on AWS RDS (MySQL) set DB_URL in .env. The JDBC driver is picked from the URL.
spring.datasource.url=${DB_URL:jdbc:mariadb://localhost:3306/hawe?sessionVariables=time_zone='+09:00'}
spring.jackson.time-zone=Asia/Seoul
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}

# Set JWT_SECRET in the environment or in a local .env file (at least 32 bytes).
jwt.secret=${JWT_SECRET}
jwt.access-token-validity-seconds=1800
jwt.refresh-token-validity-seconds=1209600
# Placeholder invitation domain; replace before public release.
hawe.invite.base-url=https://hawe.app/invite
hawe.invite.max-failures=10
hawe.invite.failure-window=10m

hawe.mission.default-publish-time=09:00
hawe.mission.default-deadline-time=23:00
# 그룹이 정할 수 있는 하루 미션 수 상한 (B7). 지금 앱은 이 값을 보내지 않아 하루 1개 그대로이고, 앱 화면은 A6.
hawe.mission.max-daily-count=5
# 발행 풀. 새 틀(TEXT_ONE_WORD, TEXT_REVIEW, TEXT_BALANCE)은
# 앱(A4)이 그릴 수 있게 배포된 뒤에 여기에 추가한다.
hawe.mission.enabled-templates=PHOTO_NOW,PHOTO_GALLERY,PHOTO_COLOR,DRAW_SKETCH,DRAW_A_TO_B,TEXT_ACROSTIC,TEXT_FILL_BLANK
# 미션 문장 AI (B8). 켜려면 .env 나 환경변수에 HAWE_MISSION_AI_ENABLED=true 와 키를 둔다.
# 운영 측 LLM 게이트웨이(Bedrock)는 LLM_BASE_URL·LLM_API_KEY·LLM_MODEL(예: bedrock-haiku),
# Anthropic API 를 직접 쓰면 ANTHROPIC_API_KEY 만 둔다 (주소·모델은 기본값).
# 꺼져 있거나 키가 없거나 AI 가 실패하면 고정 문장을 쓴다. 키는 저장소에 올리지 않는다.
hawe.mission.ai.enabled=${HAWE_MISSION_AI_ENABLED:false}
hawe.mission.ai.base-url=${LLM_BASE_URL:}
hawe.mission.ai.api-key=${LLM_API_KEY:${ANTHROPIC_API_KEY:}}
hawe.mission.ai.model=${LLM_MODEL:}
# 팀원 프롬프트(깃 제외 폴더). 운영 서버에서는 file:/경로/파일 로 바꾼다. 하나도 없으면 mission-ai/default-prompt.txt
hawe.mission.ai.prompt-paths=classpath:prompts/mission-create-prompt.md,classpath:prompts/mission-template-prompt.md
# 카테고리 기본값(일상,감성,추억,유머)은 코드에 있다. 이 파일은 ISO-8859-1 로 읽히므로 한글 값(categories,
# blocked-words, special-days)은 \uXXXX 로 쓰거나 환경변수로 넣는다. 예: 크리스마스
# hawe.mission.ai.special-days=12-25=크리스마스
# AI 주제 vs 랜덤 주제 비교 실험 (B9). (그룹, 날짜)마다 군을 나눈다. 켜도 AI 를 쓸 수 없으면 실험하지 않는다.
# salt 를 바꾸면 배정이 새로 섞이므로 실험을 새로 시작할 때만 바꾼다.
hawe.experiment.topic.enabled=${HAWE_EXPERIMENT_TOPIC_ENABLED:false}
hawe.experiment.topic.ai-ratio=0.5
hawe.experiment.topic.salt=hawe-topic-1
# 내부 리포트(GET /internal/experiments/topic) 헤더 토큰. 비워 두면 리포트가 꺼진다. 저장소에 올리지 않는다
hawe.admin.token=${HAWE_ADMIN_TOKEN:}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB
# 파일 저장소: local(기본, ./uploads) 또는 s3. 운영(EC2)은 .env 에 STORAGE_TYPE=s3 와 S3_BUCKET 을 둔다.
# S3 키(S3_ACCESS_KEY/S3_SECRET_KEY)를 비우면 EC2 IAM Role 이나 ~/.aws/credentials 를 쓴다. 키는 저장소에 올리지 않는다.
hawe.storage.type=${STORAGE_TYPE:local}
hawe.storage.local-dir=./uploads
hawe.storage.public-base-url=/files
hawe.storage.s3.bucket=${S3_BUCKET:}
hawe.storage.s3.region=${S3_REGION:ap-northeast-2}
hawe.storage.s3.access-key=${S3_ACCESS_KEY:}
hawe.storage.s3.secret-key=${S3_SECRET_KEY:}
hawe.storage.s3.url-ttl=1h

# Vision topic-fit review. Thresholds follow ml/vision-service/EVAL.md (2026-10-13).
hawe.vision.enabled=${HAWE_VISION_ENABLED:false}
hawe.vision.base-url=${HAWE_VISION_BASE_URL:http://localhost:8001}
hawe.vision.connect-timeout=3s
hawe.vision.read-timeout=10s
hawe.vision.retry-delay=2s
hawe.vision.photo-now.perfect-threshold=0.024
hawe.vision.photo-now.good-threshold=0.017
hawe.vision.photo-color.perfect-threshold=0.132
hawe.vision.photo-color.good-threshold=0.104

# 월별 그룹 활동 인사이트: 이번 달 캐시는 갱신하고 지난달 캐시는 유지한다.
hawe.insight.enabled=true
hawe.insight.current-month-ttl=30m
hawe.insight.top-words=10
hawe.insight.min-word-count=2
