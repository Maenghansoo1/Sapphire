spring.application.name=hawe
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=jdbc:mariadb://localhost:3306/hawe?sessionVariables=time_zone='+09:00'
spring.jackson.time-zone=Asia/Seoul
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# Set JWT_SECRET in the environment or in a local .env file (at least 32 bytes).
jwt.secret=${JWT_SECRET}
jwt.access-token-validity-seconds=1800
jwt.refresh-token-validity-seconds=1209600
jwt.invite-token-validity-seconds=604800

hawe.mission.default-publish-time=09:00
hawe.mission.default-deadline-time=23:00
hawe.mission.max-daily-count=5
