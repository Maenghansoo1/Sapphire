spring.application.name=hawe

spring.datasource.url=jdbc:mariadb://localhost:3306/hawe
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# dev-only default; override JWT_SECRET via .env for anything beyond local dev
jwt.secret=${JWT_SECRET:dev-only-default-secret-please-override-me-via-env-32bytes-min}
jwt.access-token-validity-seconds=1800
jwt.refresh-token-validity-seconds=1209600
jwt.invite-token-validity-seconds=604800
