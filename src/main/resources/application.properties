spring.application.name=hawe
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=jdbc:mariadb://localhost:3306/hawe
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# Set JWT_SECRET in the environment or in a local .env file (at least 32 bytes).
jwt.secret=${JWT_SECRET}
jwt.access-token-validity-seconds=1800
jwt.refresh-token-validity-seconds=1209600
jwt.invite-token-validity-seconds=604800
